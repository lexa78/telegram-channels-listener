services:
  php-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php-bot
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    volumes:
      - ./:/app          # чтобы код можно было менять без сборки
      - ./session.madeline:/app/session.madeline
    networks:
      - botnet
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r 'fsockopen(\"rabbitmq\", 5672) || exit(1);'"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  botnet:
    external: true
